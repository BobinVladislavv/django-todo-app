{% extends "tasks/base.html" %}

{% block header_title%}Вход в систему{% endblock %}

{% block title %} Вход {% endblock %}

{% block content %}

    <form method="POST" class="auth-form">

        {{ form.as_p }}

    <p style="margin-top: 15px;">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>

{% endblock %}
